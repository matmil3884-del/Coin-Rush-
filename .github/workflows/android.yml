
name: Coin Rush Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app and Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp arcade-upgrade.css www/arcade-upgrade.css
          cp arcade-upgrade.js www/arcade-upgrade.js
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.coinrush.game",
            "appName": "Coin Rush",
            "webDir": "www"
          }
          EOF

      - name: Generate Android project
        run: npx cap add android

      - name: Verify Android launcher is configured
        run: |
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Sync game files
        run: npx cap sync android

      - name: Build test APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug

      - name: Build Play Store AAB
        run: android/gradlew -p android bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
