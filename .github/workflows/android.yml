name: Coin Rush Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app and Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp arcade-upgrade.css www/arcade-upgrade.css
          cp arcade-upgrade.js www/arcade-upgrade.js
          cp premium-effects.js www/premium-effects.js
          cp three-d-upgrade.js www/three-d-upgrade.js
          cp background-music.js www/background-music.js
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.coinrush.game",
            "appName": "Coin Rush",
            "webDir": "www"
          }
          EOF

      - name: Generate Android project
        run: npx cap add android


      - name: Apply designed Coin Rush launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import math
          root = Path("android/app/src/main/res")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              out = root / folder
              out.mkdir(parents=True, exist_ok=True)
              im = Image.new("RGBA", (size,size), (7,14,38,255))
              px = im.load()
              for y in range(size):
                  for x in range(size):
                      dx=x-size*.5; dy=y-size*.5
                      glow=max(0,1-math.sqrt(dx*dx+dy*dy)/(size*.72))
                      px[x,y]=(int(8+12*glow),int(16+32*glow),int(43+70*glow),255)
              d=ImageDraw.Draw(im)
              margin=size*.09
              d.ellipse((margin,margin,size-margin,size-margin), fill=(12,27,64,255), outline=(0,224,255,255), width=max(1,size//32))
              d.ellipse((size*.19,size*.17,size*.81,size*.79), fill=(120,58,0,255), outline=(255,221,107,255), width=max(1,size//22))
              d.ellipse((size*.24,size*.22,size*.76,size*.74), fill=(255,190,37,255), outline=(255,246,168,255), width=max(1,size//30))
              try: font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",int(size*.43))
              except: font=ImageFont.load_default()
              box=d.textbbox((0,0),"$",font=font); tw=box[2]-box[0]; th=box[3]-box[1]
              d.text(((size-tw)/2,(size-th)/2-box[1]-size*.01),"$",font=font,fill=(103,47,0,255),stroke_width=max(0,size//96),stroke_fill=(255,239,143,255))
              # small cyan speed streaks evoke the COIN RUSH wordmark
              d.line((size*.19,size*.82,size*.81,size*.82),fill=(69,245,255,255),width=max(1,size//28))
              d.line((size*.30,size*.88,size*.70,size*.88),fill=(255,202,65,255),width=max(1,size//40))
              im.save(out/"ic_launcher.png")
              im.save(out/"ic_launcher_round.png")
          # Remove adaptive-icon XML so Android uses the matching designed PNGs at every density.
          for name in ("ic_launcher.xml","ic_launcher_round.xml"):
              p=root/"mipmap-anydpi-v26"/name
              if p.exists(): p.unlink()
          PY

      - name: Configure release signing when secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not all configured. The AAB will be unsigned and is not Play Store upload-ready."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/coin-rush-upload.jks
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("coin-rush-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          release_block = text.find("release {", text.find("buildTypes {"))
          if release_block < 0:
              raise SystemExit("Could not locate release buildType in android/app/build.gradle")
          close = text.find("\n        }", release_block)
          if close < 0:
              raise SystemExit("Could not locate end of release buildType")
          block = text[release_block:close]
          if "signingConfig" not in block:
              text = text[:close] + '\n            signingConfig signingConfigs.release' + text[close:]
          path.write_text(text)
          PY
          echo "Release signing configured."

      - name: Verify Android launcher is configured
        run: |
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Sync game files
        run: npx cap sync android

      - name: Build test APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug

      - name: Build Play Store AAB
        run: android/gradlew -p android bundleRelease

      - name: Verify AAB signing status
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB was not generated."
            exit 1
          fi
          if [ -f android/app/coin-rush-upload.jks ]; then
            jarsigner -verify "$AAB" >/dev/null
            echo "AAB signature verification passed."
          else
            echo "::warning::AAB built without release signing. Configure the four ANDROID_* repository secrets before Play Store upload."
          fi

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
